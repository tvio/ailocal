[project]
name = "ailocal"
version = "0.2.0"
description = "Dema použití lokálních LLM pro podnikovou praxi"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.5",
    "psycopg[binary]>=3.2",
    "PyMuPDF>=1.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.scripts]
chat-self = "chat_self:main"
