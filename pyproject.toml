[project]
name = "localsemantic"
version = "0.1.0"
description = "Chytré vyhledávání v léčivech – hybrid search (sémantika + fulltext) nad daty SÚKL"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32.5",
    "psycopg[binary]>=3.2",
    "PyMuPDF>=1.25",
    "docling>=2.0",
    "openai>=3.2.0",
    "pymupdf4llm>=1.28.2",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
